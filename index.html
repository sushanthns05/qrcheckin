<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>BRAINIACS 2026 Check-In</title>


  <!-- QR SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        sans-serif;

      background:
        #f4f4f4;

      text-align: center;

    }


    .container {

      width: 100%;

      max-width: 600px;

      margin: auto;

    }


    h1 {

      margin:
        5px 0;

      font-size:
        30px;

    }


    h2 {

      margin:
        5px 0 20px;

    }


    #stats {

      background:
        white;

      padding:
        15px;

      border-radius:
        12px;

      margin:
        15px 0;

      font-size:
        20px;

      font-weight:
        bold;

    }


    #reader {

      width:
        100%;

      max-width:
        500px;

      min-height:
        300px;

      margin:
        20px auto;

      background:
        white;

      border-radius:
        15px;

      overflow:
        hidden;

    }


    #result {

      background:
        white;

      padding:
        20px;

      margin:
        20px 0;

      border-radius:
        15px;

      font-size:
        18px;

      line-height:
        1.5;

    }


    .valid {

      background:
        #d4edda !important;

    }


    .already {

      background:
        #fff3cd !important;

    }


    .invalid {

      background:
        #f8d7da !important;

    }


    button {

      border:
        none;

      border-radius:
        10px;

      padding:
        15px 30px;

      font-size:
        18px;

      font-weight:
        bold;

      background:
        #222;

      color:
        white;

      cursor:
        pointer;

    }


    button:disabled {

      opacity:
        0.5;

      cursor:
        not-allowed;

    }


    .small {

      font-size:
        14px;

      color:
        #666;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>BRAINIACS 2026</h1>

  <h2>Team Check-In</h2>


  <div id="stats">

    Loading...

  </div>


  <div id="reader"></div>


  <div id="result">

    <strong>
      Ready to scan.
    </strong>

    <p class="small">

      Tap the button and allow
      camera access.

    </p>

  </div>


  <button
    id="scanButton"
    onclick="startScanner()">

    📷 Scan Next Team

  </button>


</div>


<script>


// ======================================================
// CONFIGURATION
// ======================================================


// YOUR APPS SCRIPT WEB APP URL

const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbwWYiBDzA8NphKU9xOM7GR3h7EcIRZygqIlgXphqdizV6uW2AAFFkTUJFVhMHYptE-5Vw/exec";


// MUST MATCH SCANNER_KEY IN CODE.GS

const SCANNER_KEY =
  "BRAINIACS-SCAN-2026-SJBIT


let scanner = null;

let scanning = false;

let processing = false;


// ======================================================
// START SCANNER
// ======================================================

function startScanner() {

  if (scanning) {
    return;
  }


  processing = false;


  const resultBox =
    document.getElementById(
      "result"
    );


  const scanButton =
    document.getElementById(
      "scanButton"
    );


  resultBox.className = "";

  resultBox.innerHTML =
    "<strong>Starting camera...</strong><br>" +
    "Please allow camera access.";


  scanButton.disabled = true;


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    resultBox.className =
      "invalid";

    resultBox.innerHTML =
      "<h2>Scanner Error</h2>" +
      "<p>QR scanner library failed to load.</p>";

    scanButton.disabled = false;

    return;

  }


  scanner =
    new Html5Qrcode(
      "reader"
    );


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      },

      aspectRatio: 1.0

    },

    function(decodedText) {

      onScanSuccess(
        decodedText
      );

    },

    function(errorMessage) {

      // Normal scanning errors.
      // Ignore them.

    }

  )

  .then(function() {

    scanning = true;

    scanButton.disabled = true;

    resultBox.className = "";

    resultBox.innerHTML =
      "<strong>📷 Camera Ready</strong><br>" +
      "Point the camera at the team's QR code.";

  })

  .catch(function(error) {

    scanning = false;

    scanButton.disabled = false;

    resultBox.className =
      "invalid";

    resultBox.innerHTML =

      "<h2>⚠ CAMERA ERROR</h2>" +

      "<p>" +

      escapeHtml(
        error.message ||
        String(error)
      ) +

      "</p>" +

      "<p>" +
      "Please allow camera access " +
      "for this website." +
      "</p>";

  });

}


// ======================================================
// QR SCANNED
// ======================================================

function onScanSuccess(
  decodedText
) {

  if (processing) {
    return;
  }


  processing = true;


  stopScanner();


  const resultBox =
    document.getElementById(
      "result"
    );


  resultBox.className = "";

  resultBox.innerHTML =
    "<h2>Checking team...</h2>" +
    "<p>Please wait.</p>";


  checkInTeam(
    decodedText
  );

}


// ======================================================
// STOP CAMERA
// ======================================================

function stopScanner() {

  if (!scanner) {
    return;
  }


  scanner.stop()

    .then(function() {

      scanning = false;

    })

    .catch(function() {

      scanning = false;

    });

}


// ======================================================
// CHECK TEAM THROUGH APPS SCRIPT
// ======================================================

function checkInTeam(
  qrData
) {

  const callbackName =
    "checkInCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {

      try {

        if (
          response.success
        ) {

          showResult(
            response.result
          );

          updateStats();

        } else {

          showError(
            response.message ||
            "Unable to process QR code."
          );

        }

      } catch (error) {

        showError(
          error.message
        );

      }


      delete window[
        callbackName
      ];


      processing = false;


      document
        .getElementById(
          "scanButton"
        )
        .disabled = false;

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    BACKEND_URL +

    "?action=checkin" +

    "&qr=" +
    encodeURIComponent(
      qrData
    ) +

    "&key=" +
    encodeURIComponent(
      SCANNER_KEY
    ) +

    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      showError(
        "Unable to connect to the check-in server."
      );


      delete window[
        callbackName
      ];


      processing = false;


      document
        .getElementById(
          "scanButton"
        )
        .disabled = false;

    };


  document.body.appendChild(
    script
  );

}


// ======================================================
// SHOW CHECK-IN RESULT
// ======================================================

function showResult(
  result
) {

  const box =
    document.getElementById(
      "result"
    );


  if (
    result.status ===
    "valid"
  ) {

    box.className =
      "valid";


    box.innerHTML = `

      <h2>✓ VALID TEAM</h2>

      <p>
        <strong>Team ID</strong><br>
        ${escapeHtml(
          result.teamId
        )}
      </p>

      <p>
        <strong>Team Name</strong><br>
        ${escapeHtml(
          result.teamName
        )}
      </p>

      <p>
        <strong>Team Leader</strong><br>
        ${escapeHtml(
          result.leaderName
        )}
      </p>

      <p>
        <strong>Checked In At</strong><br>
        ${escapeHtml(
          result.time
        )}
      </p>

      <h3>
        ✓ Check-in successful
      </h3>

    `;

  }


  else if (
    result.status ===
    "already"
  ) {

    box.className =
      "already";


    box.innerHTML = `

      <h2>
        ⚠ ALREADY CHECKED IN
      </h2>

      <p>
        <strong>Team ID</strong><br>
        ${escapeHtml(
          result.teamId
        )}
      </p>

      <p>
        <strong>Team Name</strong><br>
        ${escapeHtml(
          result.teamName
        )}
      </p>

      <p>
        <strong>Original Check-In</strong><br>
        ${escapeHtml(
          result.time
        )}
      </p>

    `;

  }


  else {

    box.className =
      "invalid";


    box.innerHTML = `

      <h2>
        ✕ INVALID QR CODE
      </h2>

      <p>
        This QR code does not belong
        to a registered team.
      </p>

      <p>
        <strong>QR Data:</strong><br>
        ${escapeHtml(
          result.teamId ||
          ""
        )}
      </p>

    `;

  }

}


// ======================================================
// SHOW ERROR
// ======================================================

function showError(
  message
) {

  const box =
    document.getElementById(
      "result"
    );


  box.className =
    "invalid";


  box.innerHTML =

    "<h2>⚠ ERROR</h2>" +

    "<p>" +

    escapeHtml(
      message
    ) +

    "</p>";

}


// ======================================================
// UPDATE STATISTICS
// ======================================================

function updateStats() {

  const callbackName =
    "statsCallback_" +
    Date.now();


  window[callbackName] =
    function(response) {

      if (
        response &&
        response.success &&
        response.stats
      ) {

        document
          .getElementById(
            "stats"
          )
          .innerHTML =

          "Checked In: " +
          response.stats.checkedIn +
          " / " +
          response.stats.capacity +
          " Teams";

      } else {

        document
          .getElementById(
            "stats"
          )
          .innerHTML =
          "Checked In: 0 / 50 Teams";

      }


      delete window[
        callbackName
      ];

    };


  const script =
    document.createElement(
      "script"
    );


  script.src =

    BACKEND_URL +

    "?action=stats" +

    "&key=" +
    encodeURIComponent(
      SCANNER_KEY
    ) +

    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      document
        .getElementById(
          "stats"
        )
        .innerHTML =
        "Checked In: 0 / 50 Teams";

      delete window[
        callbackName
      ];

    };


  document.body.appendChild(
    script
  );

}


// ======================================================
// HTML ESCAPING
// ======================================================

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ======================================================
// INITIAL LOAD
// ======================================================

updateStats();

</script>

</body>

</html>
